name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk StandInGamer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StandInGamer-apk
          path: StandInGamer.apk
      # Direct phone-friendly download: .../releases/latest/download/StandInGamer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stand-In Gamer (build ${{ github.run_number }})
          make_latest: true
          body: |
            Tap **StandInGamer.apk** below on your Android phone to download, then open it and allow "Install unknown apps".
            Built automatically from commit ${{ github.sha }}.
          files: StandInGamer.apk
