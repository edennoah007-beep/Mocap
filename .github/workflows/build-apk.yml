name: Build APK
on:
  push:
    branches: [vstage]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk VStage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VStage-apk
          path: VStage.apk
      # Phone-friendly download: .../releases/download/vstage-build-N/VStage.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vstage-build-${{ github.run_number }}
          name: VStage (build ${{ github.run_number }})
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Tap **VStage.apk** below on your Android phone to download, then open it and allow "Install unknown apps".
            Built automatically from commit ${{ github.sha }}.
          files: VStage.apk
